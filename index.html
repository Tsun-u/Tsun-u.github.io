<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tsun-u</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0a;color:#a09080;font-family:"Courier New",monospace;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.terminal{
  max-width:520px;width:100%;background:#111;
  border:1px solid #2a2a2a;border-radius:6px;
  padding:32px 28px;
  box-shadow:0 16px 48px rgba(0,0,0,0.6);
}
.prompt{color:#5a8a5a;margin-bottom:16px;font-size:0.9em}
.output{
  background:#0a0a0a;border:1px solid #222;border-radius:3px;
  padding:16px;margin:16px 0;
  font-size:0.95em;letter-spacing:0.05em;
  word-break:break-all;line-height:1.8;
  color:#c0b090;text-align:center;
  user-select:all;cursor:text;
}
.hint{
  color:#555;font-size:0.8em;text-align:center;
  margin-top:20px;font-style:italic;
}
.cursor{animation:blink 1s step-end infinite;color:#5a8a5a}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="terminal">
  <div class="prompt">tsun-u@home:~$ cat message.txt</div>
  <div class="output">aHR0cHM6Ly90c3VuLXUuZ2l0aHViLmlvLzA4MjQv</div>
  <div class="prompt">tsun-u@home:~$ <span class="cursor">▋</span></div>
  <div class="hint">這不是亂碼。試試 Base，8 的平方。</div>
</div>
</body>
</html>
